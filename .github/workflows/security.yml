name: Security Scan

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write
  actions: read
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run security scan daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  security-scan:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: "actions/checkout@v4"

      - name: Setup Node.js
        uses: "actions/setup-node@v4"
        with:
          node-version: '22'

      - name: Setup Bun
        uses: "oven-sh/setup-bun@v2"
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Snyk Security Scan
        if: ${{ env.SNYK_TOKEN != '' }}
        run: bunx snyk test --severity-threshold=high --file=package.json
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Run Snyk Vulnerability Audit
        if: ${{ env.SNYK_TOKEN != '' }}
        run: bunx snyk monitor --project-name=gabrielvfonseca/site
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true
